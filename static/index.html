<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanPilot: plan an event with a team of agents</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --paper: #eef1f4; --panel: #ffffff; --ink: #1b2a41; --muted: #5d6b7f;
    --line: #cfd6df; --accent: #e9a23b; --accent-ink: #3a2602; --danger: #a63d2f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #11161d; --panel: #1a222d; --ink: #e8edf3; --muted: #93a1b4;
            --line: #2c3745; --accent: #e9a23b; --accent-ink: #261800; --danger: #e08a7c;
            color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px;
         display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  h1 { font: 700 2rem/1.1 Georgia, "Iowan Old Style", serif; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea { width: 100%; min-height: 170px; padding: 12px; border: 1px solid var(--line);
             border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; resize: vertical; }
  textarea:focus, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--ink); background: var(--ink); color: var(--paper); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--ink); }
  button:disabled { opacity: .5; cursor: progress; }
  .row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .examples { margin-top: 18px; color: var(--muted); font-size: .9rem; }
  .examples button { display: block; width: 100%; text-align: left; margin-top: 8px; font-weight: 400;
                     background: var(--panel); color: var(--ink); border-color: var(--line); }
  .result { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 24px 28px; min-height: 240px; }
  .empty { color: var(--muted); }
  .status { font-weight: 600; margin: 0 0 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .status.err { color: var(--danger); }
  .result table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  .result th, .result td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .result a { color: inherit; }
  .review { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
  .review textarea { min-height: 80px; }
</style>
</head>
<body>
<main>
  <section>
    <h1>PlanPilot</h1>
    <p class="sub">Describe your event. A team of agents finds venues, vendors, weather, budget and a schedule. You review before it's final.</p>
    <label for="msg">Your event</label>
    <textarea id="msg" placeholder="Example: A 2-day college tech fest for 300 people in Indore in March, budget ₹1.5 lakh."></textarea>
    <div class="row"><button id="go" class="primary">Build my plan</button></div>
    <div class="examples">Try an example
      <button type="button" data-ex="Plan a 2-day college tech fest for 300 people in Indore in March with a budget of 150000 INR.">College tech fest, 300 people</button>
      <button type="button" data-ex="Plan a small birthday dinner for 20 guests in Mumbai next month, budget 40000 INR.">Birthday dinner, 20 guests</button>
    </div>
  </section>

  <section class="result" id="out" aria-live="polite">
    <p class="empty">Your plan will appear here. It usually takes under a minute.</p>
  </section>
</main>

<script>
let threadId = null;
const $ = (id) => document.getElementById(id);
const out = $("out"), go = $("go"), msg = $("msg");

const md = (t) => DOMPurify.sanitize(marked.parse(t || ""));
const status = (t, err) => `<p class="status ${err ? "err" : ""}">${t}</p>`;

document.querySelectorAll("[data-ex]").forEach((b) =>
  b.addEventListener("click", () => { msg.value = b.dataset.ex; msg.focus(); }));

async function call(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `Request failed (${r.status})`);
  return data;
}

function render(d) {
  threadId = d.thread_id;
  if (d.status === "needs_review") {
    out.innerHTML = status(`Draft ready for your review${d.revisions ? ` (revision ${d.revisions})` : ""}`) + md(d.draft) + `
      <div class="review">
        <label for="fb">Want changes? Say what to change.</label>
        <textarea id="fb" placeholder="Example: find a cheaper venue and add a DJ."></textarea>
        <div class="row">
          <button id="approve" class="primary">Approve and finish</button>
          <button id="revise" class="ghost">Request changes</button>
        </div>
      </div>`;
    $("approve").onclick = () => review(true);
    $("revise").onclick = () => review(false);
  } else if (d.status === "blocked") {
    out.innerHTML = md(d.answer);
  } else {
    out.innerHTML = status("Final plan") + md(d.answer) + `<div class="row"><button class="ghost" onclick="window.print()">Print or save as PDF</button></div>`;
  }
}

async function review(approved) {
  const fb = $("fb") ? $("fb").value : "";
  if (!approved && !fb.trim()) { $("fb").focus(); return; }
  out.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try { render(await call("/api/plan/review", { thread_id: threadId, approved, feedback: fb })); }
  catch (e) { out.insertAdjacentHTML("afterbegin", status(e.message, true)); out.querySelectorAll("button").forEach((b) => (b.disabled = false)); }
}

go.addEventListener("click", async () => {
  if (!msg.value.trim()) { msg.focus(); return; }
  go.disabled = true;
  out.innerHTML = status("Agents are working on your plan…");
  try { render(await call("/api/plan", { message: msg.value, thread_id: null })); }
  catch (e) { out.innerHTML = status(e.message, true); }
  go.disabled = false;
});
</script>
</body>
</html>
